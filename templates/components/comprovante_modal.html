<dialog class="et-dialogo comprovante-dialog"
        id="comprovante-dialog"
        aria-labelledby="comprovante-dialog-title">
    <button type="button"
            class="et-dialogo-fechar et-botao et-botao--fantasma et-botao--icone et-botao--pequeno"
            data-comprovante-fechar
            aria-label="Fechar" data-tooltip><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg></button>
    <div class="et-dialogo-cabeca">
        <p class="eyebrow">Comprovante em análise</p>
        <h2 class="et-dialogo-titulo" id="comprovante-dialog-title">Revisar comprovante</h2>
    </div>
    <div class="comprovante-resumo">
        <div>
            <span>Aluno</span>
            <strong data-comprovante-aluno>—</strong>
        </div>
        <div>
            <span>Valor</span>
            <strong data-comprovante-valor>—</strong>
        </div>
        <div>
            <span>Competência</span>
            <strong data-comprovante-competencia>—</strong>
        </div>
        <div>
            <span>Enviado em</span>
            <strong data-comprovante-enviado>—</strong>
        </div>
    </div>
    <div class="comprovante-preview-area">
        <img data-comprovante-img alt="Comprovante enviado pelo aluno" hidden>
        <p class="comprovante-sem-preview" data-comprovante-sem-preview hidden>
            Não foi possível exibir uma prévia (pode ser um PDF).
        </p>
        <a data-comprovante-abrir
           href="#"
           target="_blank"
           rel="noopener"
           class="et-botao et-botao--contorno">Abrir em nova aba</a>
    </div>
    <div class="comprovante-acoes">
        <form data-comprovante-form-aprovar
              method="POST"
              action=""
              class="form-revisao">
                    {% include "components/csrf_field.html" %}
            <input class="et-campo et-campo--pequeno" type="date" name="data_pagamento" aria-label="Data do pagamento">
            <select class="et-campo et-campo--pequeno" name="forma_pagamento" aria-label="Forma de pagamento">
                <option value="transferencia">Transferência</option>
                <option value="dinheiro">Dinheiro</option>
            </select>
            <input class="et-campo et-campo--pequeno" type="text"
                   name="observacao"
                   maxlength="255"
                   aria-label="Observação sobre a aprovação"
                   placeholder="Observação (opcional)">
            <button type="submit" class="et-botao et-botao--confirmar et-botao--pequeno">Aprovar</button>
        </form>
        <form data-comprovante-form-rejeitar
              method="POST"
              action=""
              class="form-revisao">
                    {% include "components/csrf_field.html" %}
            <input class="et-campo et-campo--pequeno" type="text"
                   name="observacao"
                   maxlength="255"
                   aria-label="Motivo da rejeição"
                   placeholder="Motivo da rejeição">
            <button type="submit" class="et-botao et-botao--perigo et-botao--pequeno">Rejeitar</button>
        </form>
    </div>
</dialog>
