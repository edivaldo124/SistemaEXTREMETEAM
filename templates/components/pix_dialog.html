<dialog class="et-dialogo pix-dialog" id="pix-dialog" aria-labelledby="pix-dialog-title">
    <button type="button" class="et-dialogo-fechar et-botao et-botao--fantasma et-botao--icone et-botao--pequeno" data-pix-fechar aria-label="Fechar" data-tooltip><svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg></button>
    <div class="et-dialogo-cabeca">
        <p class="eyebrow">Pagamento via Pix</p>
        <h2 class="et-dialogo-titulo" id="pix-dialog-title">Pagar mensalidade</h2>
    </div>
    <div class="pix-corpo" data-pix-estado="carregando">
        <p class="pix-carregando" role="status" aria-live="polite">Gerando cobrança Pix...</p>
    </div>
    <div class="pix-corpo" data-pix-estado="erro" hidden>
        <p class="et-aviso et-aviso--perigo" data-pix-erro-msg role="alert">Não foi possível gerar o Pix. Tente novamente.</p>
        <button type="button" class="et-botao et-botao--contorno" data-pix-tentar-novamente>Tentar novamente</button>
    </div>
    <div class="pix-corpo" data-pix-estado="pronto" hidden>
        <div class="pix-resumo">
            <div>
                <span>Valor</span>
                <strong data-pix-valor>—</strong>
            </div>
            <div>
                <span>Vencimento</span>
                <strong data-pix-vencimento>—</strong>
            </div>
        </div>
        <div class="pix-qr-area">
            <img data-pix-qr alt="QR Code para pagamento via Pix" hidden>
            <p class="pix-sem-qr" data-pix-sem-qr hidden>QR Code indisponível no momento. Use o código copia e cola abaixo.</p>
        </div>
        <label for="pix-copia-cola">Pix copia e cola</label>
        <div class="pix-copia-linha">
            <input class="et-campo" id="pix-copia-cola"
                   type="text"
                   readonly
                   data-pix-copia-cola
                   aria-label="Código Pix copia e cola">
            <button type="button" class="et-botao et-botao--contorno" data-pix-copiar>Copiar código</button>
        </div>
        <p class="et-aviso et-aviso--alerta pix-status" data-pix-status role="status" aria-live="polite">Aguardando pagamento…</p>
    </div>
</dialog>
