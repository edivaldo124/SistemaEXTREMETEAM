<dialog class="et-dialogo"
        id="confirm-dialog"
        role="alertdialog"
        aria-labelledby="confirm-dialog-title"
        aria-describedby="confirm-dialog-message">
    <div class="et-dialogo-icone" aria-hidden="true">
        <svg viewBox="0 0 24 24">
            <path d="M12 8v5m0 3.5v.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
    </div>
    <div class="et-dialogo-cabeca">
        <p class="eyebrow" id="confirm-dialog-eyebrow">Confirmar ação</p>
        <h2 class="et-dialogo-titulo" id="confirm-dialog-title">Você tem certeza?</h2>
        <p class="et-dialogo-descricao" id="confirm-dialog-message">Revise esta ação antes de continuar.</p>
    </div>
    <div class="et-dialogo-rodape">
        <button type="button" class="et-botao et-botao--contorno" data-modal-cancel>Cancelar</button>
        <button type="button" class="et-botao et-botao--principal" data-modal-accept>Confirmar</button>
    </div>
</dialog>
