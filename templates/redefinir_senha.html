<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nova senha | Centro de Treinamento Extreme Team</title><link rel="icon" type="image/png" href="{{ url_for('static', filename='imagens/logo-icon.png') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/recuperar.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/extreme.css') }}">
</head>
<body>
<main class="recovery-shell">
    <section class="recovery-brand"><a class="site-brand" href="/"><img src="{{ url_for('static', filename='imagens/logo-icon.png') }}" alt=""><span>Centro de treinamento<br><strong>Extreme Team</strong></span></a><div><p class="eyebrow">Recuperação segura</p><h1>Volte para<br>o seu ritmo.</h1><p>Escolha uma nova senha de acesso.</p></div><span class="marker">02 / ACESSO</span></section>
    <section class="recovery-panel"><div class="recovery-form"><a class="back-link" href="/login">← Voltar ao login</a><p class="eyebrow">Redefinir acesso</p><h2 class="page-title">Nova senha</h2><p class="page-subtitle">Escolha uma nova senha para sua conta.</p>
        {% if erro %}<div class="msg" role="alert">{{ erro }}</div>{% endif %}
        <form action="{{ url_for('auth.redefinir_senha', token=token) }}" method="post">
            <div class="field"><label for="nova_senha">Nova senha</label><input id="nova_senha" type="password" name="nova_senha" autocomplete="new-password" minlength="6" required></div>
            <button class="button-primary" type="submit">Salvar nova senha →</button>
        </form>
    </div></section>
</main>
</body></html>
