services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no arquivo .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5

  rate-limit:
    image: redis:7-alpine
    restart: unless-stopped
    # volatile-ttl: sob pressão de memória sai primeiro a chave mais perto de expirar.
    # Com allkeys-lru o Redis apagava contadores de limite ainda em uso, e quem estava
    # bloqueado voltava a ter cota inteira justamente quando havia carga.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Folga acima do maxmemory para a sobrecarga do próprio processo do Redis.
    mem_limit: 96m
    cpus: 0.25

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rate-limit:
        condition: service_healthy
    environment:
      # Aponta para o serviço "db" acima (Postgres do próprio compose), montado a
      # partir das mesmas POSTGRES_* usadas para subir o container do banco - não
      # precisa (nem deve) apontar para um Postgres do host aqui.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?defina POSTGRES_USER no arquivo .env}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:?defina POSTGRES_DB no arquivo .env}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no arquivo .env}
      ADMIN_USER: ${ADMIN_USER:?defina ADMIN_USER no arquivo .env}
      # Obrigatório: gere com `python -m servicos.credenciais`.
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?defina ADMIN_PASSWORD_HASH no arquivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RATELIMIT_STORAGE_URI: redis://rate-limit:6379/0
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,10.0.0.105}
      TRUST_PROXY_COUNT: "1"
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_CLIENT_ID: ${MERCADO_PAGO_CLIENT_ID:-}
      MERCADO_PAGO_CLIENT_SECRET: ${MERCADO_PAGO_CLIENT_SECRET:-}
      MERCADO_PAGO_TOKEN_KEY: ${MERCADO_PAGO_TOKEN_KEY:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      MERCADO_PAGO_AMBIENTE: ${MERCADO_PAGO_AMBIENTE:-}
      KEEP_ALIVE: ${KEEP_ALIVE:-false}
      KEEP_ALIVE_INTERVALO: ${KEEP_ALIVE_INTERVALO:-}
      # Opcional: GA4 só em página pública e com consentimento (README).
      ANALYTICS_ID: ${ANALYTICS_ID:-}
      # Opcional: Sentry sem dado pessoal (README, "Monitoramento").
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-producao}
      UPLOAD_DIR: /app/uploads
    volumes:
      # Fotos de perfil e comprovantes manuais - o filesystem do container é
      # descartado a cada rebuild/deploy, então isso PRECISA ficar num volume
      # nomeado (persistente) e nunca só no disco do container.
      - uploads_data:/app/uploads
    expose:
      - "5000"
    mem_limit: 192m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s

  backup:
    # Mesma imagem (e versão do pg_dump) do serviço "db". Todo dia em BACKUP_HORA gera
    # banco.dump (pg_dump custom, compactado) + uploads.tar.gz em "backups_data", com
    # retenção de 7 diários e 4 semanais. Restauração e teste: README, "Backup e restauração".
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/agendar.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?defina POSTGRES_DB no arquivo .env}
      PGUSER: ${POSTGRES_USER:?defina POSTGRES_USER no arquivo .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      TZ: ${BACKUP_TZ:-America/Sao_Paulo}
      BACKUP_HORA: ${BACKUP_HORA:-03:30}
      BACKUP_DIARIOS: ${BACKUP_DIARIOS:-7}
      BACKUP_SEMANAIS: ${BACKUP_SEMANAIS:-4}
    volumes:
      - ./tools/backup:/scripts:ro
      # Só leitura: o backup nunca altera fotos e comprovantes.
      - uploads_data:/uploads:ro
      - backups_data:/backups
    mem_limit: 128m
    cpus: 0.25

  https:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    mem_limit: 64m
    cpus: 0.25

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uploads_data:
  # Backups diários/semanais. Fica no mesmo disco: copie para fora da máquina (README).
  backups_data:
